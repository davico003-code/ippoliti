<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDE7DA">
<title>Distrito Roldán — Plano interactivo de lotes | SI INMOBILIARIA</title>
<meta name="description" content="Plano interactivo de Distrito Roldán: 180 lotes en Ruta 9 y María Auxiliadora, Roldán. Consultá disponibilidad, medidas, superficie y precio de cada lote.">
<style>
/* ============================================================
   DISTRITO ROLDÁN — PLANO INTERACTIVO
   SI INMOBILIARIA · David Flores (Mat. 0621)
   ============================================================ */
:root{
  --paper:#EDE7DA; --paper-2:#E3DCCC;
  --ink:#23291F; --ink-2:#5A6152; --line:rgba(35,41,31,.14);
  --disp:#6B8F3C; --nodisp:#C79A2E; --vend:#9A9689;
  --brand:#2F4A3A;
  --panel:#FBF8F1; --shadow:0 1px 2px rgba(35,41,31,.10), 0 8px 24px -8px rgba(35,41,31,.22);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:rgba(107,143,60,.18);
  -webkit-font-smoothing:antialiased;
}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #1F5FBF;outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;touch-action:manipulation}

/* ?pantalla=completa (link público /distrito-roldan-precios, 06-sep-2026): el
   iframe ocupa al menos toda la pantalla y el plano se centra adentro. Así la
   hoja del lote y su fondo oscuro llegan al borde inferior real de la pantalla
   (antes el iframe medía lo justo del plano y la hoja quedaba flotando). */
html.completa{height:100%}
html.completa body{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.wrap{max-width:920px;margin:0 auto;padding:14px;
  padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
@media (max-width:960px){ .wrap{padding:8px} }

/* ---------- encabezado ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin:2px 2px 12px}
.head h1{margin:0;font-size:clamp(20px,2.4vw,28px);line-height:1.15;letter-spacing:-.02em;font-weight:700}
.head h1 span{color:var(--ink-2);font-weight:500}
.head .sub{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
.head .live{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink-2);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow)}

/* ---------- barra de filtros ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:linear-gradient(180deg,#FDFBF6,var(--panel));
  border:1px solid var(--line);border-radius:18px;
  padding:9px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(35,41,31,.05), 0 10px 26px -14px rgba(35,41,31,.3)}

/* capas de estado: píldoras que se encienden con su color */
.layers{display:flex;gap:7px;flex-wrap:wrap}
.layers button{
  --c:#B4AEA0; --tint:#F3F0E8;
  display:inline-flex;align-items:center;gap:7px;
  min-height:36px;padding:7px 12px 7px 10px;
  border:1.5px solid var(--line);background:#fff;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;letter-spacing:-.005em;
  transition:border-color .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
  box-shadow:0 1px 1px rgba(35,41,31,.04)}
.layers button:hover{border-color:#CBC3B2;background:#FDFCF9;color:var(--ink)}
.layers i{
  width:11px;height:11px;border-radius:999px;display:block;flex:none;
  background:transparent;box-shadow:inset 0 0 0 2px var(--c);
  transition:background .18s ease,box-shadow .18s ease}
.lbl-sh{display:none}
.linkish{display:inline-flex;align-items:center;gap:6px}
.layers b{
  font-weight:700;font-variant-numeric:tabular-nums;font-size:11.5px;
  min-width:22px;padding:1px 6px;border-radius:999px;text-align:center;
  background:var(--tint);color:var(--ink-2);
  transition:background .18s ease,color .18s ease}
.layers button[aria-pressed="true"]{
  color:var(--ink);border-color:var(--c);background:var(--tint);
  box-shadow:0 1px 2px rgba(35,41,31,.07), 0 6px 16px -8px var(--c)}
.layers button[aria-pressed="true"] i{background:var(--c);box-shadow:inset 0 0 0 2px var(--c),0 0 0 2.5px #fff}
.layers button[aria-pressed="true"] b{background:#fff;color:var(--ink)}
.layers button[data-lay="d"]{--c:#6B8F3C; --tint:#EDF3E2}
.layers button[data-lay="n"]{--c:#C79A2E; --tint:#FAF2DE}
.layers button[data-lay="v"]{--c:#9A9689; --tint:#F0EEEA}

/* segmento de tipo */
.seg{display:inline-flex;background:#EFEBE1;border-radius:999px;padding:3px;gap:2px;
  max-width:100%;overflow-x:auto;scrollbar-width:none;
  box-shadow:inset 0 1px 2px rgba(35,41,31,.06)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;border:0;background:transparent;border-radius:999px;
  padding:6px 13px;min-height:30px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);
  box-shadow:0 1px 2px rgba(35,41,31,.12),0 2px 6px -2px rgba(35,41,31,.14)}

.bar input[type=search]{
  font-size:16px;padding:7px 14px;min-height:36px;width:132px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);
  transition:border-color .18s ease,box-shadow .18s ease}
.bar input[type=search]:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(47,74,58,.12)}
.spacer{flex:1 1 auto;min-width:0}
.linkish{border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 14px;min-height:36px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;
  transition:background .18s ease,border-color .18s ease,color .18s ease}
.linkish:hover{background:var(--paper-2);border-color:#CBC3B2;color:var(--ink)}

/* ---------- mapa ----------
   Sin zoom: el plano nunca baja de --minplano de ancho, y si no entra
   en la pantalla el contenedor se desplaza con el dedo o la rueda. */
:root{ --minplano:0px }   /* el plano siempre entra completo, sin desplazamiento */
.mapbox{position:relative;background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
.mapscroll{overflow:auto;border-radius:var(--r);overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.mapscroll svg{display:block;width:100%;min-width:var(--minplano);height:auto}
@media (max-width:700px){
  .mapscroll{overflow:visible}
  .lot.dim text{display:none}    /* con el plano chico, sin ruido de números apagados */
}

.lot{cursor:pointer;transition:opacity .18s ease}
.lot rect.f{transition:fill .22s ease,opacity .16s ease}
.lot:hover rect.f,.lot.on rect.f{opacity:.84}
.lot rect.o{fill:none;stroke:rgba(255,255,255,.8);stroke-width:1.2;pointer-events:none}
.lot.on rect.o{stroke:#111;stroke-width:3.4}
.lot text{fill:#fff;font-weight:700;pointer-events:none;paint-order:stroke;
  stroke:rgba(18,26,14,.38);stroke-width:2.4px;stroke-linejoin:round}
.lot.lit rect.f{filter:url(#glow)}
.lot.lit rect.o{stroke:#F2FFD6;stroke-width:2.2}
.lot.lit text{stroke:rgba(40,60,14,.55)}
.lot.dim{opacity:.26;pointer-events:none}
.lot:focus{outline:none}
.lot:focus-visible rect.o{stroke:#1F5FBF;stroke-width:4}
.street{fill:#5F5B51;font-size:15.5px;letter-spacing:.07em;font-weight:800}
.mzplate{fill:rgba(35,41,31,.5);font-size:15px;font-weight:700;letter-spacing:.08em}

/* Brújula. El Norte apunta a Ruta 9: arriba con el plano girado (celular),
   a la derecha en escritorio. No intercepta toques, así que no tapa lotes. */
.compass{position:absolute;left:12px;bottom:12px;z-index:32;pointer-events:none;
  width:58px;height:58px;border-radius:999px;
  background:rgba(253,251,246,.94);border:1.5px solid rgba(35,41,31,.22);
  box-shadow:0 1px 2px rgba(35,41,31,.12),0 6px 16px -8px rgba(35,41,31,.5);
  display:flex;align-items:center;justify-content:center}
.compass .needle{display:block;width:34px;height:34px;transform:rotate(90deg)}
.compass .needle svg{display:block;width:100%;height:100%}
.compass .n{position:absolute;font-size:11px;font-weight:800;color:var(--ink);
  line-height:1;right:4px;top:50%;transform:translateY(-50%)}
@media (max-width:700px){
  .compass{width:52px;height:52px;left:auto;right:12px}
  .compass .needle{transform:none}
  .compass .n{right:auto;top:3px;left:50%;transform:translateX(-50%)}
}

/* aviso de desplazamiento, solo si el plano no entra completo */
.swipe{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:34;
  display:none;align-items:center;gap:8px;pointer-events:none;
  background:rgba(28,34,24,.9);color:#fff;border-radius:999px;padding:9px 16px;
  font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.22);
  transition:opacity .25s ease}
.swipe.on{display:flex}
.swipe.gone{opacity:0}
.swipe svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- aviso flotante ---------- */
.toast{position:absolute;left:50%;top:14px;z-index:36;transform:translate(-50%,-14px);
  background:rgba(28,34,24,.94);color:#fff;border-radius:999px;padding:11px 20px;
  font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2),0 14px 30px -12px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;flex:none}

/* ---------- tooltip de hover ---------- */
.tip{position:absolute;left:0;top:0;z-index:30;pointer-events:none;opacity:0;will-change:transform;
  background:rgba(28,34,24,.96);color:#fff;border-radius:12px;padding:10px 13px;
  font-size:13px;line-height:1.45;min-width:190px;max-width:250px;
  box-shadow:0 2px 6px rgba(0,0,0,.24),0 14px 34px -10px rgba(0,0,0,.5);transition:opacity .12s ease}
.tip.show{opacity:1}
.tip .h{margin-bottom:7px}
.tip .h b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
.tip .h span{display:block;margin-top:2px;font-size:11.5px;color:rgba(255,255,255,.66);font-weight:600}
.tip .st{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.tip .st i{width:7px;height:7px;border-radius:99px;display:block;flex:none}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-variant-numeric:tabular-nums}
.tip dt{color:rgba(255,255,255,.6);font-size:12px}
.tip dd{margin:0;text-align:right;font-weight:600;font-size:12.5px}
.tip .pr{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.16);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tip .pr small{color:rgba(255,255,255,.6);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tip .pr b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.tip .pr2{margin-top:2px;padding-top:0;border-top:0}
.tip .pr2 b{font-size:14px;color:rgba(255,255,255,.82)}
.tip .cta{margin-top:7px;font-size:11px;color:rgba(255,255,255,.55)}
.tip .cta2{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.16);font-size:12px}
@media (hover:none){ .tip{display:none} }

/* Tres vistas: el plano dibujado, la foto sola y las dos combinadas.
   En las dos que muestran foto se apaga el dibujo de base. */
.foto-capa{display:none}
.v-foto .foto-capa,.v-mixta .foto-capa{display:block}
.v-foto .base,.v-mixta .base{display:none}
.v-foto .street,.v-foto .mzplate,.v-mixta .street,.v-mixta .mzplate{display:none}
/* foto sola: el terreno tal cual, sin lotes encima */
.v-foto .lot{opacity:0;pointer-events:none}
/* el reservorio se marca solo cuando se ve la foto */
.res-foto{display:none}
.v-foto .res-foto,.v-mixta .res-foto{display:block}
.res-foto text{paint-order:stroke;stroke:rgba(10,32,32,.55);stroke-width:3px;stroke-linejoin:round}
/* combinada: los lotes translúcidos dejan ver el terreno */
.v-mixta .lot rect.f{opacity:.42}
.v-mixta .lot:hover rect.f,.v-mixta .lot.on rect.f{opacity:.62}
.v-mixta .lot rect.o{stroke:rgba(255,255,255,.92);stroke-width:1.6}
.v-mixta .lot text{stroke:rgba(12,20,8,.72);stroke-width:3px}

/* pie: fecha de actualización + descargo */
.pie{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 12px;
  margin:9px 4px 0;font-size:11.5px;line-height:1.5;color:#7C8272}
.pie .fecha{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  color:var(--ink-2);font-weight:600}
.pie .fecha::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--disp)}
.pie .fecha b{color:var(--ink);font-weight:700}
.pie .legal{flex:1 1 260px;min-width:0}
@media (max-width:560px){ .pie{font-size:10.5px;gap:3px 10px;margin-top:8px} }

/* ---------- hoja del lote ----------
   06-sep-2026: reemplaza al "tocar lote → wa.me". En escritorio flota sobre el
   plano (arriba a la derecha); en el celular es una hoja que sube desde abajo.
   Tres vistas: detalle (la cuota primero), pedido (nombre + WhatsApp) y listo.
   Paleta del plano (tierra/verde oliva); el verde de marca SI (#17613C) solo en
   la tarjeta del equipo. */
.scrim{position:fixed;inset:0;z-index:58;background:rgba(35,41,31,.30);opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
@media (min-width:961px){ .scrim{display:none} }
.side{position:absolute;right:12px;top:12px;width:352px;z-index:38;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 2px 6px rgba(35,41,31,.14),0 18px 44px -14px rgba(35,41,31,.5);
  opacity:0;transform:translateY(-8px);pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;max-height:calc(100% - 24px);overflow:auto;
  overscroll-behavior:contain;font-variant-numeric:tabular-nums}
.side.open{opacity:1;transform:translateY(0);pointer-events:auto}
.side .body{padding:14px 18px 16px}
.side .handle{display:none;width:38px;height:5px;border-radius:3px;background:#CBC3B2;margin:8px auto 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.row-r{display:flex;align-items:center;gap:8px}
.closer{width:44px;height:44px;margin-right:-8px;border-radius:11px;border:1px solid var(--line);background:#fff;
  font-size:21px;line-height:1;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.closer:hover{background:var(--paper-2)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-left:-8px;padding:0 8px 0 4px;border:0;background:none;
  font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer;border-radius:8px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lotnum{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.lotnum b{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1;outline-offset:4px}
.lotnum .mz{font-size:12.5px;color:var(--ink-2);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 10px;border:1px solid transparent;white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:99px;display:block}
.tag.t-disp{background:#EAF2DE;color:#3D5720;border-color:#C9DDAE}
.tag.t-nodisp{background:#FAF0D6;color:#7A5C0C;border-color:#EAD5A0}
.tag.t-vend{background:#EDEBE7;color:#575349;border-color:#D8D4CB}
.medidas{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.medidas b{color:var(--ink);font-weight:700}
.k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
.v{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;color:var(--ink)}
.v small{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.v2{font-size:19px;color:var(--ink-2);font-weight:700}
.der{text-align:right}
.precios{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.total{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
.total .k{margin-bottom:1px;font-size:10px}
.total b{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.total b small{font-size:13px;font-weight:600;color:var(--ink-2)}
.desde{margin:9px 0 0;display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.3;color:var(--ink-2);background:var(--paper-2);border-radius:9px;padding:4px 2px 4px 10px}
.desde b{color:var(--ink);font-weight:700}
.desde span{min-width:0}   /* en anchos chicos (landing, panel de escritorio) envuelve a dos líneas en vez de cortarse */
.lnk{margin-left:auto;min-height:44px;padding:0 8px;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--brand);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;border-radius:6px;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin-top:11px;border-radius:14px;border:0;
  font:inherit;font-size:16px;font-weight:700;letter-spacing:-.005em;text-decoration:none;cursor:pointer;transition:background .14s ease,opacity .14s ease}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 20px -8px rgba(47,74,58,.65)}
.btn-p:hover{background:#26402F}
.btn-p[disabled]{opacity:.7;cursor:progress}
.btn-s{background:#fff;color:var(--brand);border:1.5px solid rgba(47,74,58,.35)}
.btn-s:hover{border-color:var(--brand)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.fine{margin:8px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-2);text-align:center}
.muted{font-size:13.5px;color:var(--ink-2);margin:12px 0 0;line-height:1.5}
.muted b{color:var(--ink)}
/* pedido */
.ttl{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.15;outline-offset:4px}
.ttl.c{text-align:center;font-size:28px;margin-top:14px}
.sub{margin:5px 0 0;font-size:14.5px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 13px 7px 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:700}
.chip i{width:9px;height:9px;border-radius:99px;background:var(--disp);box-shadow:0 0 0 2.5px #EAF2DE;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(35,41,31,.05),0 10px 26px -14px rgba(35,41,31,.3)}
.team-head{padding:11px 14px 9px;border-bottom:1px solid var(--line)}
.team-head img{display:block;height:19px;width:auto}
.team-body{display:flex;gap:12px;align-items:center;padding:10px 14px 11px}

@media (max-width:960px){
  /* Bottom sheet. Es position:fixed DENTRO del iframe, o sea fija al recuadro
     del iframe y no a la pantalla: --abajo y --vis los calcula el JS
     (colocarHoja) midiendo qué franja del iframe está a la vista en el padre,
     así la hoja se pega al borde inferior de esa franja también cuando el
     iframe es más alto que la pantalla (landing). */
  .side{position:fixed;left:0;right:0;top:auto;bottom:var(--abajo,0px);width:auto;border-radius:22px 22px 0 0;

}

}

const LAY={d:false,n:false,v:false};
const F={tipo:"all",q:""};

function visible(l){
  if(F.tipo!=="all" && (l.com?1:0)!==+F.tipo) return false;
  if(F.q && !String(l.n).startsWith(F.q)) return false;
  return true;
}
function paint(){
  let shown=0;
  for(const l of lots){
    const on=LAY[l.estado];
    l.face.setAttribute("fill", on ? EST[l.estado].g : baseFill(l));
    l.node.classList.toggle("lit", on && l.estado==="d");
    const v=visible(l); l.node.classList.toggle("dim",!v); if(v) shown++;
  }
  const c={d:0,n:0,v:0}; for(const l of lots) c[l.estado]++;
  document.querySelectorAll("[data-lay]").forEach(b=>{ b.querySelector("b").textContent=c[b.dataset.lay]; });
  const act=Object.keys(LAY).filter(k=>LAY[k]);
  document.getElementById("live").textContent =
    act.length ? act.map(k=>`${c[k]} ${EST[k].k.toLowerCase()}s`).join(" · ")
               : `${shown} lotes en el plano`;
  syncURL();
}
function syncURL(){
  const p=new URLSearchParams();
  const act=Object.keys(LAY).filter(k=>LAY[k]);
  if(act.length)p.set("ver",act.join(","));
  if(F.tipo!=="all")p.set("tipo",F.tipo);
  if(sel)p.set("lote",sel);
  if(PANTALLA)p.set("pantalla",PANTALLA);
  const q=p.toString();
  history.replaceState(null,"",q?"?"+q:location.pathname);
}

/* Financiación: entrega = precio × anticipo %; cuota = (precio − entrega) /
   cuotas; las dos redondeadas a entero. Misma cuenta que hace el servidor. */
function finDe(l){
  if(!l.conPrecio) return null;
  const f=l.fin, ent=l.precio*f.anticipoPct/100;
  return {pct:f.anticipoPct, cuotas:f.cuotas, entrega:Math.round(ent), cuota:Math.round((l.precio-ent)/f.cuotas),
          ahorro: l.contado!=null && l.contado<l.precio ? l.precio-l.contado : null};
}
/* La cuota más baja entre los residenciales a la venta: el ancla "desde". */
function cuotaMinima(){
  let best=null;
  for(const l of lots){
    if(l.com||!l.conPrecio) continue;
    const f=finDe(l);
    if(!best||f.cuota<best.cuota) best={l,cuota:f.cuota};
  }
  return best;
}

        <div class="der"><span class="k">Entrega (${f.pct} %)</span><span class="v v2">${USD(f.entrega)}</span></div></div>
      <p class="fin">Precio total <b>${USD(l.precio)}</b>${l.contado!=null?` · Contado <b>${USD(l.contado)}</b>${f.ahorro?` (−${USD(f.ahorro)} pagando todo junto)`:""}`:""}</p>` : ""}
    </div>
    <a class="btn btn-s" href="${TOUR_360}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3.5 12h17"/></svg>Mientras, mirá el barrio en 360°</a>
    <button type="button" class="lnk-back" data-act="cerrar">Volver al plano</button>`;
}

function render(enfocar){
  const l=byN.get(sel); if(!l) return;
  dBody.innerHTML = hoja.view==="form" ? vistaForm(l) : hoja.view==="listo" ? vistaListo(l) : vistaDetalle(l);
  side.classList.add("open"); scrim.classList.add("on"); side.scrollTop=0;
  colocarHoja();
  if(enfocar){ const t=document.getElementById("hoja-ttl"); if(t) t.focus({preventScroll:true}); }
}
/* opts.mantener: redibujo del plano (datos vivos) — conserva la vista y no
   vuelve a medir. opts.enfocar: se abrió con teclado, el foco pasa a la hoja. */
function select(n, opts={}){
  const l=byN.get(n); if(!l) return;
  if(sel!=null && byN.get(sel)) byN.get(sel).node.classList.remove("on");
  sel=n; l.node.classList.add("on");
  if(!opts.mantener){ hoja.view="detalle"; hoja.fallos=0; }
  render(!!opts.enfocar);
  if(!opts.mantener){
    medir("LoteVisto",{lote:n, precio:l.conPrecio?l.precio:0},"dr_lote_visto",false);
    acercarLote(l);
  }
  syncURL();
}
function deselect(){
  side.classList.remove("open"); scrim.classList.remove("on");
  if(sel!=null && byN.get(sel)) byN.get(sel).node.classList.remove("on");
  sel=null; hoja.view="detalle"; syncURL();
}
function verDisponibles(){
  if(!LAY.d){ LAY.d=true; document.querySelector('[data-lay="d"]').setAttribute("aria-pressed","true"); }
  deselect(); paint(); say("Los lotes a la venta, en verde claro. "+VERBO());
}

/* Celular AR: deja los 10 dígitos que van después de +54 9 (misma regla que
   normalizarCelularAr en el servidor; tolera "+54 9 341…", "0341 15…"). */
function normCel(raw){
  let d=(raw||"").replace(/\D/g,"");
  if(d.startsWith("549")) d=d.slice(3); else if(d.startsWith("54")&&d.length>10) d=d.slice(2);
  if(d.startsWith("0")) d=d.slice(1);
  const m = d.length===12 ? d.match(/^(\d{2,4})15(\d{6,8})$/) : null;
  if(m) d=m[1]+m[2];
  return d;
}
function paginaPadre(){
  try{ if(window.parent!==window) return parent.location.href; }catch(_){}
  return (window.parent!==window && document.referrer) ? document.referrer : location.href;
}
function utmDe(url){
  try{
    const p=new URL(url).searchParams, g=k=>p.get("utm_"+k)||null;
    const u={source:g("source"),medium:g("medium"),campaign:g("campaign"),content:g("content")};
    return (u.source||u.medium||u.campaign||u.content)?u:null;
  }catch(_){ return null; }
}

async function enviar(){
  if(hoja.enviando) return;                       // guardia de reentrada
  const l=byN.get(sel); if(!l) return;
  const inN=document.getElementById("f-nombre"), inW=document.getElementById("f-wa"), wrapW=document.getElementById("wrap-wa");
  const eN=document.getElementById("e-nombre"), eW=document.getElementById("e-wa"), eS=document.getElementById("e-send");
  const nombre=inN.value.trim(), cel=normCel(inW.value);
  let primero=null;
  const marcar=(inp,el,msg,wrap)=>{
    el.textContent=msg; el.hidden=!msg;
    inp.setAttribute("aria-invalid",msg?"true":"false"); (wrap||inp).classList.toggle("bad",!!msg);
    if(msg&&!primero) primero=inp;
  };
  marcar(inN,eN, nombre.length<2 ? "Contanos tu nombre para saber a quién escribirle." : "");
  marcar(inW,eW, /^[1-3]\d{9}$/.test(cel) ? "" : "Son 10 dígitos con el código de área (341, 3476…), sin el 15.", wrapW);
  if(primero){ primero.focus(); return; }

  hoja.enviando=true;
  const btn=document.getElementById("btn-send");
  btn.disabled=true; btn.setAttribute("aria-busy","true"); btn.textContent="Enviando…"; eS.hidden=true;
  const pag=paginaPadre();
  const body={ nombre, whatsapp:cel, website:document.getElementById("f-web").value,
    lote:{ nro:l.n, tipo:l.com?"comercial":"residencial", frente:l.frente, fondo:l.fondo, sup:l.sup,
           precio:l.conPrecio?l.precio:null, contado:l.conPrecio?l.contado:null, estado:l.estado },
    utm:utmDe(pag), paginaUrl:pag };
  let ok=false, msg="No pudimos registrar tu consulta. Probá de nuevo en un momento.";
  try{
    const r=await fetch("/api/distrito-roldan/consulta",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>null);
    ok = r.ok && !!j && j.ok===true;
    if(!ok && j && typeof j.error==="string") msg=j.error;
  }catch(_){}
  hoja.enviando=false;
  if(ok){
    hoja.nombre=nombre; hoja.view="listo"; hoja.fallos=0;
    // 'Lead' SOLO con el 200 del servidor (= Hilo aceptó), nunca antes.
    medir("Lead",{content_name:"Lote Distrito Roldán",lote:l.n},"dr_pedido",true);
    render(true); return;
  }
  hoja.fallos++;
  btn.disabled=false; btn.removeAttribute("aria-busy"); btn.textContent="Reintentar";
  // Último recurso, tras dos fallos seguidos: el WhatsApp de la web (no el de la
  // inmobiliaria, que está bloqueado).
  eS.innerHTML = esc(msg) + (hoja.fallos>=2
    ? ` <a href="https://wa.me/${WA_CONTINGENCIA}?text=${encodeURIComponent(`Hola, quiero consultar por el lote ${l.n} de ${CFG.proyecto}`)}" target="_blank" rel="noopener noreferrer">Escribinos por WhatsApp</a>`
    : "");
  eS.hidden=false;
  if(eS.scrollIntoView) eS.scrollIntoView({block:"nearest"});
}

/* ---------- medición ----------
   El plano vive en un iframe same-origin: el píxel de Meta y GA4 están en la
   página padre, así que se disparan ahí (parent.fbq / parent.gtag). Si el
   padre no los tiene, no pasa nada. */
function ventanaMedicion(){
  try{ if(window.parent!==window && (typeof parent.fbq==="function"||typeof parent.gtag==="function")) return parent; }catch(_){}
  return window;
}
function medir(fbEvento, params, gaEvento, estandar){
  const w=ventanaMedicion();
  try{ if(typeof w.fbq==="function") w.fbq(estandar?"track":"trackCustom", fbEvento, params); }catch(_){}
  try{ if(typeof w.gtag==="function") w.gtag("event", gaEvento, {...params, page_location: paginaPadre()}); }catch(_){}
}

/* ---------- posición de la hoja dentro del iframe ----------
   La hoja es position:fixed DENTRO del iframe: queda fija al recuadro del
   iframe, no a la pantalla. En la landing el iframe mide más que la pantalla y
   "bottom:0" caía fuera de la vista. Como es same-origin, se mide qué franja
   del iframe está a la vista en el padre y la hoja se pega al borde inferior
   de ESA franja; se recalcula cuando el padre scrollea o cambia de tamaño
   (teclado del celular incluido). Abierto sin iframe, la franja es la
   pantalla entera. */
function franjaVisible(){
  const H=innerHeight;
  try{
    const fe=window.frameElement;
    if(fe && window.parent!==window){
      const r=fe.getBoundingClientRect();
      const pv=parent.visualViewport, ph=pv?pv.height:parent.innerHeight, pt=pv?pv.offsetTop:0;
      const top=Math.max(0, pt-r.top), bottom=Math.min(r.height, pt+ph-r.top);
      if(bottom>top) return {top,bottom};
    }
  }catch(_){}
  return {top:0,bottom:H};
}
function colocarHoja(){
  if(!side.classList.contains("open")) return;
  if(!MOVIL()){ side.style.removeProperty("--abajo"); side.style.removeProperty("--vis"); return; }
  const v=franjaVisible();
  side.style.setProperty("--abajo", Math.max(0, innerHeight-v.bottom)+"px");
  side.style.setProperty("--vis", Math.max(260, v.bottom-v.top)+"px");
}
/* Si la hoja tapa el lote que se acaba de tocar y el iframe sigue más abajo de
   la pantalla, se pide al padre que scrollee lo justo para que el lote quede
   visible encima de la hoja. Best-effort: si no hay margen, no se hace nada. */
function acercarLote(l){
  if(!MOVIL()) return;
  try{
    const fe=window.frameElement; if(!fe || window.parent===window) return;
    const r=fe.getBoundingClientRect(), lr=l.node.getBoundingClientRect();
    const pv=parent.visualViewport, ph=pv?pv.height:parent.innerHeight;
    const lotTop=r.top+lr.top, lotBot=r.top+lr.bottom;
    const necesario = lotBot - (ph - side.offsetHeight - 12);
    const margen = (r.top + r.height) - ph;
    const dy=Math.min(necesario, margen, lotTop-8);
    if(dy>2) parent.scrollBy({top:dy, behavior:"smooth"});
  }catch(_){}
}
(function seguirPadre(){
  let raf=0;
  const upd=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; colocarHoja(); }); };
  window.addEventListener("resize",upd);
  try{
    if(window.parent===window) return;
    parent.addEventListener("scroll",upd,{passive:true});
    parent.addEventListener("resize",upd);
    if(parent.visualViewport){ parent.visualViewport.addEventListener("resize",upd); parent.visualViewport.addEventListener("scroll",upd); }
  }catch(_){}
})();
function bindSvg(s){
  s.addEventListener("click",e=>{
    const g=e.target.closest(".lot"); if(g && !g.classList.contains("dim")) select(+g.dataset.n);
  });
  s.addEventListener("keydown",e=>{
    const g=e.target.closest(".lot");
    if(g && (e.key==="Enter"||e.key===" ")){e.preventDefault();select(+g.dataset.n,{enfocar:true});}
  });
  if(!CAN_HOVER) return;
  s.addEventListener("pointermove",e=>{
    if(e.pointerType!=="mouse") return;
    const g=e.target.closest(".lot");
    if(!g||g.classList.contains("dim")) return hideTip();
    const l=byN.get(+g.dataset.n); if(l) showTip(l,e.clientX,e.clientY);
  });
  s.addEventListener("pointerleave",hideTip);
  s.addEventListener("focusin",e=>{
    const g=e.target.closest(".lot"); if(!g) return;
    const l=byN.get(+g.dataset.n); if(!l) return;
    const r=g.getBoundingClientRect(); warm=true; showTip(l,r.right,r.bottom);
  });
  s.addEventListener("focusout",hideTip);
}

/* ---------- tooltip de hover ---------- */
const tip=document.getElementById("tip");
let tipOn=false,tipT=null,coolT=null,warm=false,tipLot=null;
function tipHTML(l){
  const e=EST[l.estado];
  return `<div class="h"><b>Lote ${l.n}</b><span>Mz. ${l.mz} · ${l.com?"Comercial":"Residencial"}</span></div>
    <div class="st" style="color:${e.tc}"><i style="background:${e.tc}"></i>${e.k}</div>
    <dl>
      <dt>Frente</dt><dd>${med(l.frente)}</dd>
      <dt>Fondo</dt><dd>${med(l.fondo)}</dd>
      <dt>Superficie</dt><dd>${m2(l.sup)}</dd>
    </dl>
    ${l.conPrecio ? `
    <div class="pr"><small>Lista</small><b>${usd(l.precio)}</b></div>
    <div class="pr pr2"><small>Contado</small><b>${usd(l.contado)}</b></div>
    <div class="cta">Clic para ver financiación y consultar</div>`
    : `<div class="cta cta2">Este lote no está a la venta</div>`}`;
}
function placeTip(cx,cy){
  const r=box.getBoundingClientRect();
  let x=cx-r.left+16,y=cy-r.top+16;
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  if(x+tw>r.width-8)  x=cx-r.left-tw-16;
  if(y+th>r.height-8) y=cy-r.top-th-16;
  tip.style.transform=`translate(${Math.max(8,x)}px,${Math.max(8,y)}px)`;
}
function showTip(l,cx,cy){
  if(tipLot!==l.n){tip.innerHTML=tipHTML(l);tipLot=l.n;}
  placeTip(cx,cy);
  if(tipOn) return;
  clearTimeout(tipT);
  tipT=setTimeout(()=>{tip.classList.add("show");tipOn=true;warm=true;}, warm?0:140);
}
function hideTip(){
  clearTimeout(tipT);tip.classList.remove("show");tipOn=false;tipLot=null;
  clearTimeout(coolT);coolT=setTimeout(()=>{warm=false;},450);
}
if(CAN_HOVER){
  box.addEventListener("pointerdown",hideTip);
  window.addEventListener("scroll",()=>{if(tipOn)hideTip();},{passive:true});
}
bindSvg(svg);

/* Al girar el teléfono o cruzar el punto de corte, el plano se redibuja
   en la orientación que corresponde y se recuperan estado y selección. */
window.matchMedia("(max-width: 700px)").addEventListener("change",()=>{
  const abierto=sel;
  svg=build(); bindSvg(svg); paint();
  if(abierto!=null){ const l=byN.get(abierto); if(l) l.node.classList.add("on"); }
  checkOverflow();
});

/* ---------- desplazamiento del plano ----------
   Sin zoom: se usa el scroll nativo del contenedor. En celular se arrastra
   con el dedo; en escritorio, con la rueda o shift+rueda. */
const scroller=document.getElementById("mapscroll");
const swipe=document.getElementById("swipe");
let swipeSeen=false;

function checkOverflow(){
  const over = scroller.scrollWidth - scroller.clientWidth > 8;
  swipe.classList.toggle("on", over && !swipeSeen);
}
function dismissSwipe(){
  if(swipeSeen) return;
  swipeSeen=true; swipe.classList.add("gone");
  setTimeout(()=>swipe.classList.remove("on","gone"),300);
}
scroller.addEventListener("scroll",()=>{ dismissSwipe(); if(tipOn) hideTip(); },{passive:true});
new ResizeObserver(checkOverflow).observe(scroller);
window.addEventListener("resize",checkOverflow);

/* la rueda vertical sobre el plano lo desplaza en horizontal cuando hace falta */
scroller.addEventListener("wheel",e=>{
  if(e.deltaX!==0 || e.shiftKey) return;
  const over=scroller.scrollWidth-scroller.clientWidth>8;
  if(!over) return;
  const room = (e.deltaY<0 && scroller.scrollLeft>0) || (e.deltaY>0 && scroller.scrollLeft<scroller.scrollWidth-scroller.clientWidth-1);
  if(!room) return;
  e.preventDefault(); scroller.scrollLeft += e.deltaY;
},{passive:false});

/* ---------- arranque ---------- */
document.getElementById("fecha").textContent = CFG.actualizado || "—";

(function init(){
  const p=new URLSearchParams(location.search);
  if(p.get("ver")) p.get("ver").split(",").forEach(k=>{
    const b=document.querySelector(`[data-lay="${k}"]`); if(b&&!LAY[k]){LAY[k]=true;b.setAttribute("aria-pressed","true");}
  });
  if(p.get("tipo")){const b=document.querySelector(`[data-tipo="${p.get("tipo")}"]`); if(b)b.click();}
  paint(); checkOverflow();
  if(p.get("lote")) select(+p.get("lote"));
  /* Le avisamos al contenedor cuánto mide el plano, así el iframe se ajusta y
     no queda ni cortado ni con un hueco debajo.
     Ojo con qué se observa: el <html> siempre mide exactamente el alto del
     iframe, así que observarlo a él nunca avisa que el contenido creció. El que
     cambia de alto es el body. Y solo avisamos cuando el número cambió de
     verdad, para no entrar en un ida y vuelta con el contenedor. */
  let ultimoAlto=0;
  const post=(forzar)=>{
    const h=document.documentElement.scrollHeight;
    // El "no cambió" solo vale para el observador continuo. Los envíos forzados
    // salen igual: el contenedor puede montar su escucha después que el plano,
    // y si el primer aviso se pierde queda esperándolo para siempre —hay
    // pantallas que arrancan el plano invisible hasta recibirlo.
    if(!forzar && Math.abs(h-ultimoAlto)<2) return;
    ultimoAlto=h;
    try{parent.postMessage({type:"plano-height",h},"*")}catch(_){}
  };
  post(true);
  addEventListener("load",()=>post(true));   // fuentes e imágenes ya pesan lo suyo
  [80,250,700,1500].forEach(ms=>setTimeout(()=>post(true),ms));
  new ResizeObserver(()=>post()).observe(document.body);
})();

/* ---------- datos vivos ----------
   Los datos embebidos arriba son el arranque instantáneo, pero la fuente de
   verdad es lo último que se publicó desde el panel del agente
   (/agentes/plano-distrito-roldan → POST /api/plano-lotes). Acá se consulta
   ese endpoint y, si difiere, el plano se redibuja: un cambio de estado o de
   precio impacta en el sitio sin tocar el repo ni esperar un deploy.
   Abierto como archivo local o sin red, el fetch falla y quedan los datos
   embebidos: nunca rompe. */
(async function datosVivos(){
  let data=null;
  try{
    const r=await fetch("/api/plano-lotes",{cache:"no-store"});
    if(!r.ok) return;
    data=await r.json();
  }catch(_){ return; }
  if(!data || !data.lotes) return;

  let cambio=false;
  const c=data.cfg||{};
  for(const k of ["whatsapp","proyecto","actualizado"]){
    if(typeof c[k]==="string" && c[k] && c[k]!==CFG[k]){ CFG[k]=c[k]; cambio=true; }
  }
  if(c.financiacion && JSON.stringify(c.financiacion)!==JSON.stringify(CFG.financiacion)){
    CFG.financiacion=c.financiacion; cambio=true;
  }
  const EST_OK=new Set(["d","n","v"]);
  const num=v=>typeof v==="number"&&isFinite(v)&&v>=0;
  for(const l of lots){
    const r=data.lotes[l.n]; if(!r) continue;
    const estado=EST_OK.has(r.estado)?r.estado:l.estado;
    const campos={
      estado,
      frente:num(r.frente)?r.frente:l.frente,
      fondo:num(r.fondo)?r.fondo:l.fondo,
      sup:num(r.sup)?r.sup:l.sup,
      pm2:num(r.pm2)?r.pm2:null,
      precio:num(r.precio)?r.precio:null,
      contado:num(r.contado)?r.contado:null
    };
    for(const k in campos){
      if(l[k]!==campos[k]){ l[k]=campos[k]; cambio=true; }
    }
    l.fin=CFG.financiacion[l.com?"comercial":"residencial"];
    l.conPrecio = l.estado==="d" && l.precio!=null;
    // LOTES también, así un redibujo posterior (girar el teléfono) no revierte
    LOTES[l.n]={frente:l.frente,fondo:l.fondo,sup:l.sup,estado:l.estado,
                pm2:l.pm2??undefined,precio:l.precio??undefined,contado:l.contado??undefined};
  }
  if(!cambio) return;

  document.getElementById("fecha").textContent = CFG.actualizado || "—";
  // Mismo redibujo que al girar el teléfono: se recuperan estado y selección.
  const abierto=sel;
  svg=build(); bindSvg(svg); paint();
  if(abierto!=null && byN.get(abierto)) select(abierto,{mantener:true});
  checkOverflow();
})();
</script>
