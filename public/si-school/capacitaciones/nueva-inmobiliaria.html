<html lang="es-AR">

<meta charset="UTF-8">

<title>La nueva inmobiliaria · SI INMOBILIARIA</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Raleway:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--green:#1A5C38;--green-deep:#0d2f1d;--ink:#1C1C1E;--ink-soft:#5e5b54;--line:#E4E4E7;--sw:1280px;--sh:905px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--green-deep);font-family:'Raleway',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;top:50%;left:50%;width:var(--sw);transform:translate(-50%,-50%);transform-origin:center;background:#fff;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.45)}
  .frame{position:relative;width:var(--sw);height:var(--sh);background:#fff}
  .slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s ease}
  .slide.active{opacity:1;pointer-events:auto}
  .slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
  .progress{position:absolute;top:0;left:0;height:3px;background:var(--green);transition:width .35s;z-index:5}
  .chrome{height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;border-top:1px solid var(--line);background:#fff}
  .counter{font-family:'Poppins';font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:120px}
  .counter b{color:var(--green)}
  .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .2s}
  .dot.on{background:var(--green);width:16px;border-radius:3px}
  .tools{display:flex;gap:7px;align-items:center;min-width:120px;justify-content:flex-end}
  .tools button,.tools a{height:30px;min-width:30px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;font-family:'Poppins';font-weight:600;font-size:11px;padding:0 9px}
  .tools button:hover,.tools a:hover{border-color:var(--green);color:var(--green)}
  .tools button:disabled{opacity:.3;cursor:default}
  .head{display:none}
  /* Celular vertical: lista scrolleable, sin deck */
  body.list{overflow:auto;background:#F4F5F4}
  body.list #stage{position:static;transform:none!important;width:auto;box-shadow:none;background:transparent;padding:0 12px 28px}
  body.list .frame{width:auto;height:auto;background:transparent;display:flex;flex-direction:column;gap:12px}
  body.list .slide{position:relative;inset:auto;opacity:1;pointer-events:auto;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06)}
  body.list .slide img{height:auto}
  body.list .progress,body.list .chrome{display:none}
  body.list .head{display:block;padding:20px 16px 16px}
  .head .k{font-family:'Poppins';font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
  .head h1{font-family:'Raleway';font-weight:800;font-size:24px;line-height:1.1;letter-spacing:-.01em;margin-top:6px}
  .head p{font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.4}
  .head a{display:inline-flex;margin-top:12px;font-family:'Poppins';font-weight:600;font-size:12px;color:var(--green);text-decoration:none;border:1.5px solid var(--green);border-radius:8px;padding:7px 12px}
</style>
</head>

      <button id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide')),total=slides.length,i=0;
  var st=document.getElementById('stage'),cur=document.getElementById('cur'),tot=document.getElementById('tot'),prog=document.getElementById('prog');
  var prevB=document.getElementById('prev'),nextB=document.getElementById('next'),dotsWrap=document.getElementById('dots');
  var pad=function(n){return String(n).padStart(2,'0')};
  tot.textContent=pad(total);
  // El editor admin guarda el DOM tal cual: limpiar lo que arma este script.
  dotsWrap.innerHTML='';
  slides.forEach(function(s,k){s.classList.remove('active');var d=document.createElement('div');d.className='dot';d.onclick=function(){go(k)};dotsWrap.appendChild(d)});
  var dots=[].slice.call(dotsWrap.children);
  function load(k){var s=slides[k];if(!s)return;var im=s.querySelector('img');if(im&&!im.getAttribute('src')&&im.dataset.src)im.src=im.dataset.src}
  function isList(){return window.innerWidth<700&&window.innerHeight>window.innerWidth}
  function go(n){i=Math.max(0,Math.min(total-1,n));
    slides.forEach(function(s,k){s.classList.toggle('active',k===i)});
    dots.forEach(function(d,k){d.classList.toggle('on',k===i)});
    cur.textContent=pad(i+1);prog.style.width=((i+1)/total*100)+'%';
    prevB.disabled=i===0;nextB.disabled=i===total-1;
    load(i);load(i+1);load(i-1);}
  function next(){go(i+1)}function prev(){go(i-1)}
  nextB.onclick=next;prevB.onclick=prev;
  document.addEventListener('keydown',function(e){
    if(document.body.classList.contains('list'))return;
    if(['ArrowRight','ArrowDown','PageDown',' '].indexOf(e.key)>=0){e.preventDefault();next()}
    else if(['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key)>=0){e.preventDefault();prev()}
    else if(e.key==='Home')go(0);else if(e.key==='End')go(total-1);else if(e.key==='f'||e.key==='F')toggleFs()});
  var tx=0;
  st.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
  st.addEventListener('touchend',function(e){if(document.body.classList.contains('list'))return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?next():prev()}},{passive:true});
  function toggleFs(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else{document.exitFullscreen&&document.exitFullscreen()}}
  document.getElementById('fsBtn').onclick=toggleFs;
  function fit(){
    var list=isList();document.body.classList.toggle('list',list);
    if(list){slides.forEach(function(s){var im=s.querySelector('img');if(im){im.loading='lazy'}});slides.forEach(function(_,k){load(k)});st.style.transform='';return}
    var s=Math.min(window.innerWidth/st.offsetWidth,window.innerHeight/st.offsetHeight);
    st.style.transform='translate(-50%,-50%) scale('+s+')';}
  window.addEventListener('resize',fit);go(0);fit();
})();
</script>
