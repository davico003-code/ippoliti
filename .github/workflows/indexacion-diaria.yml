name: Indexación diaria — siinmobiliaria.com

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Chequeos contra producción
        id: check
        run: REPORT_FILE=report.md bash scripts/check-indexacion.sh

      - name: Abrir o actualizar issue
        if: failure() && steps.check.outcome == 'failure'
        run: |
          gh label create indexacion --color E11D21 --description "Alertas del chequeo diario de indexación" --force
          printf '\n\n[Ver corrida](%s)\n' "$RUN_URL" >> report.md
          existing="$(gh issue list --label indexacion --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "🚨 Indexación: fallo detectado $(date -u +%F)" --label indexacion --body-file report.md
          fi

      - name: Cerrar issue si se recuperó
        if: success()
        run: |
          existing="$(gh issue list --label indexacion --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            printf '\n\n[Ver corrida](%s)\n' "$RUN_URL" >> report.md
            gh issue close "$existing" --comment "$(printf '✅ Recuperado.\n\n%s' "$(cat report.md)")"
          fi
